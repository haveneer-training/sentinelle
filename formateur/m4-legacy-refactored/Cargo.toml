# Module 4 — corrigé de la refactorisation de `legacy/` (référence formateur).
#
# Paquet autonome, hors du workspace du dépôt (qui ne doit pas dépendre de `formateur/`,
# absent des dossiers de travail) :
#   cargo test --manifest-path formateur/m4-legacy-refactored/Cargo.toml
[package]
name = "sentinelle-legacy-refactored"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "CC-BY-NC-SA-4.0"
publish = false

[[bin]]
name = "sentinelle-v0"
path = "src/main.rs"

[features]
# Étape 7 du TP : la correction du double comptage (D3). Sans elle, la sortie reste
# identique à celle de la v0.1 ; avec elle, le test compare à `tests/golden/expected-fix-d3.txt`.
fix-d3 = []

[dependencies]

[dev-dependencies]
sentinelle-gen = { path = "../../generator" }

[workspace]
